<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENNNSTOREE | Product Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fafafa;
            color: #09090b;
            font-family: 'Space Grotesk', sans-serif;
            background-image: radial-gradient(rgba(239, 68, 68, 0.12) 1px, transparent 0);
            background-size: 28px 28px;
        }
        .y2k-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .y2k-btn {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            transition: all 0.25s ease;
        }
        .y2k-btn:hover {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            filter: brightness(1.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-white/80 backdrop-blur-md border-b border-red-200 px-6 py-4 sticky top-0 z-40 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2">
            <span class="text-2xl font-black tracking-tight text-zinc-950">XENNN<span class="text-red-600">STOREE</span></span>
        </a>
        <a href="cart.html" class="bg-red-50 border border-red-300 text-red-600 px-4 py-2 rounded-xl text-xs font-black uppercase">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-12 w-full flex-grow">
        <div id="product-details-container" class="y2k-card p-8 rounded-3xl grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <div class="text-center py-12 text-zinc-500 col-span-full">Loading product specifications...</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://oshltauwzurnxaqjlwdz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-WBcVndQ2JVR55yt6QfhFg_k1XB5ANd";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cart-count').textContent = cart.length;
        }

        async function loadProductDetails() {
            const container = document.getElementById('product-details-container');
            if (!productId) {
                container.innerHTML = `<p class="text-red-500 font-bold col-span-full">Invalid product selected.</p>`;
                return;
            }

            const { data: p, error } = await _supabase.from('products').select('*').eq('id', productId).single();

            if (error || !p) {
                container.innerHTML = `<p class="text-red-500 font-bold col-span-full">Product not found.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="rounded-2xl overflow-hidden bg-zinc-100 border border-red-100">
                    <img src="${p.image_url || 'https://via.placeholder.com/500'}" class="w-full h-auto object-cover">
                </div>
                <div class="space-y-6">
                    <div>
                        <span class="bg-red-100 text-red-600 border border-red-300 text-xs font-bold px-3 py-1 rounded-full uppercase">${p.category}</span>
                        <h1 class="text-3xl font-black text-zinc-950 uppercase mt-3">${p.title}</h1>
                        <p class="text-3xl font-black text-red-600 mt-2">${p.price} DZD</p>
                    </div>

                    <div class="space-y-2 border-t border-b border-red-100 py-4 text-xs font-semibold text-zinc-600">
                        <p>📐 <strong>Available Size:</strong> <span class="text-zinc-950 font-bold uppercase">${p.size}</span></p>
                        <p>📦 <strong>Availability:</strong> <span class="${p.is_available ? 'text-green-600' : 'text-red-600'} font-bold">${p.is_available ? 'In Stock (Ready to Ship)' : 'Sold Out'}</span></p>
                        <p>🚚 <strong>Shipping:</strong> Fast home delivery across all 58 Wilayas.</p>
                    </div>

                    <div class="space-y-3">
                        <button onclick="addToCart(${p.id}, '${p.title.replace(/'/g, "\\'")}', ${p.price}, '${p.image_url}', '${p.size}')" 
                            class="w-full y2k-btn py-4 rounded-xl text-white font-black uppercase text-sm tracking-wider">
                            🛒 Add To Basket
                        </button>
                        <a href="index.html" class="block text-center text-xs font-bold text-zinc-500 hover:underline">
                            &larr; Back to catalog
                        </a>
                    </div>
                </div>
            `;
        }

        function addToCart(id, title, price, image_url, size) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.push({ id, title, price, image_url, size });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            alert(`"${title}" was added to your basket!`);
        }

        loadProductDetails();
        updateCartBadge();
    </script>
</body>
</html>
