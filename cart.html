<html lang="en" class="scroll-smooth">

    <title>XENNNSTOREE | Your Basket</title>

        }
        .y2k-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .y2k-btn {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            transition: all 0.25s ease;
        }
        .y2k-btn:hover {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            filter: brightness(1.1);
        }
    </style>

    <!-- Header Navigation -->
    <header class="bg-white/90 backdrop-blur-md border-b border-red-200 px-6 py-4 sticky top-0 z-40 flex justify-between items-center">

            <span class="text-2xl font-black tracking-tight text-zinc-950">XENNN<span class="text-red-600">STOREE</span></span>
            <span class="bg-red-100 text-red-600 text-xs font-bold px-2 py-0.5 rounded uppercase border border-red-300">DZ</span>

        <a href="index.html" class="text-xs font-bold text-zinc-600 hover:text-red-600 uppercase transition">

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-10 w-full flex-grow space-y-8">
        <h1 class="text-4xl font-black uppercase text-zinc-950">Your Basket</h1>

        <div id="cart-container" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Basket Items -->
            <div id="cart-items-list" class="lg:col-span-2 space-y-4">
                <!-- Cart items load here -->
            </div>

            <!-- Order Summary Sidebar -->
            <div class="y2k-card p-6 rounded-3xl space-y-6 h-fit border-2 border-red-300">
                <h2 class="text-xl font-black uppercase text-zinc-950 border-b border-red-100 pb-3">Order Summary</h2>

                <div class="space-y-2 text-sm">
                    <div class="flex justify-between text-zinc-600">
                        <span>Items Subtotal:</span>
                        <span id="summary-subtotal" class="font-bold text-zinc-950">0 DZD</span>
                    </div>
                    <div class="flex justify-between text-zinc-600">
                        <span>Delivery Fee:</span>
                        <span id="summary-delivery-fee" class="font-bold text-red-600">Select Wilaya</span>
                    </div>
                    <div class="flex justify-between text-lg font-black text-red-600 border-t border-red-200 pt-3">
                        <span>Grand Total:</span>
                        <span id="summary-grand-total">0 DZD</span>
                    </div>
                </div>

                <!-- Checkout Form -->
                <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-4 pt-2">
                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Full Name *</label>
                        <input type="text" id="cust-name" required placeholder="e.g. John Doe" class="w-full bg-white border border-red-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Phone Number *</label>
                        <input type="tel" id="cust-phone" required placeholder="05XX XX XX XX" class="w-full bg-white border border-red-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Wilaya *</label>
                        <select id="cust-wilaya" required onchange="onWilayaChange()" class="w-full bg-white border border-red-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
                            <option value="">Select Wilaya</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Delivery Type *</label>
                        <select id="cust-delivery-type" required onchange="calculateCartTotals()" class="w-full bg-white border border-red-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
                            <option value="home">Home Delivery (À domicile)</option>
                            <option value="desk">Stop Desk / Agency</option>
                        </select>
                    </div>

                    <!-- Location Auto-detect Button -->
                    <button type="button" id="locate-btn" onclick="detectLocation()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                        <span>📍 Use Current Location (GPS / IP)</span>
                    </button>

                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Commune *</label>
                        <select id="cust-commune" required class="w-full bg-white border border-red-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
                            <option value="">Select Wilaya First</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-600 mb-1">Street Address *</label>
                        <input type="text" id="cust-address" required placeholder="e.g. Didouche Mourad Street N° 12" class="w-full bg-white border border-red-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-red-500">
                    </div>

                    <button type="submit" id="submit-btn" class="w-full y2k-btn py-3.5 rounded-xl text-white font-black uppercase tracking-wider text-xs shadow-md">
                        Confirm Order
                    </button>
                </form>
            </div>
        </div>
    </main>

        let currentCart = [];
        let itemsSubtotal = 0;
        let activeDeliveryFee = 0;

        function initWilayaSelect() {
            const select = document.getElementById('cust-wilaya');
            select.innerHTML = `<option value="">Select Wilaya</option>` + 
                Object.keys(WILAYA_RATES).map(code => {
                    const item = WILAYA_RATES[code];
                    return `<option value="${code}">${code} - ${item.name}</option>`;
                }).join('');
        }

        function onWilayaChange() {
            calculateCartTotals();
            populateCommunes();
        }

        function populateCommunes() {
            const wilayaCode = document.getElementById('cust-wilaya').value;
            const communeSelect = document.getElementById('cust-commune');

            if (!wilayaCode || !WILAYA_COMMUNES[wilayaCode]) {
                communeSelect.innerHTML = `<option value="">Select Wilaya First</option>`;
                return;
            }

            const communesList = WILAYA_COMMUNES[wilayaCode];
            communeSelect.innerHTML = `<option value="">Select Commune</option>` + 
                communesList.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function renderCart() {
            currentCart = JSON.parse(localStorage.getItem('cart') || '[]');
            const listEl = document.getElementById('cart-items-list');

            if (currentCart.length === 0) {
                listEl.innerHTML = `
                    <div class="y2k-card p-8 rounded-3xl text-center space-y-3">
                        <div class="text-4xl">🛒</div>
                        <h3 class="text-lg font-black uppercase text-zinc-950">Your basket is empty</h3>
                        <a href="index.html" class="inline-block bg-zinc-950 text-white text-xs font-bold px-4 py-2 rounded-xl uppercase">Explore Collection</a>
                    </div>
                `;
                itemsSubtotal = 0;
                calculateCartTotals();
                return;
            }

            itemsSubtotal = 0;
            listEl.innerHTML = currentCart.map((item, index) => {
                const itemPrice = parseFloat(item.price) || 0;
                itemsSubtotal += itemPrice;
                const displayImg = (item.image_url || item.image || '').split(',')[0] || 'https://via.placeholder.com/150';

                return `
                    <div class="y2k-card p-4 rounded-2xl flex items-center gap-4 border border-red-200">
                        <img src="${displayImg}" class="w-20 h-20 object-cover rounded-xl border border-red-100">
                        <div class="flex-grow">
                            <h3 class="font-black text-zinc-950 uppercase text-sm">${item.title}</h3>
                            <p class="text-xs text-zinc-500">Size: <span class="font-bold text-zinc-800">${item.size || 'Standard'}</span></p>
                            <p class="text-red-600 font-black text-sm mt-1">${itemPrice.toLocaleString()} DZD</p>
                        </div>
                        <button onclick="removeItem(${index})" class="text-xs font-bold text-red-600 hover:bg-red-50 border border-red-200 px-3 py-1.5 rounded-lg transition">
                            Remove
                        </button>
                    </div>
                `;
            }).join('');

            calculateCartTotals();
        }

        function calculateCartTotals() {
            const wilayaCode = document.getElementById('cust-wilaya').value;
            const deliveryType = document.getElementById('cust-delivery-type').value;

            if (wilayaCode && WILAYA_RATES[wilayaCode]) {
                activeDeliveryFee = WILAYA_RATES[wilayaCode][deliveryType] || 0;
                document.getElementById('summary-delivery-fee').textContent = `${activeDeliveryFee.toLocaleString()} DZD`;
            } else {
                activeDeliveryFee = 0;
                document.getElementById('summary-delivery-fee').textContent = "Select Wilaya";
            }

            const grandTotal = itemsSubtotal + activeDeliveryFee;

            document.getElementById('summary-subtotal').textContent = `${itemsSubtotal.toLocaleString()} DZD`;
            document.getElementById('summary-grand-total').textContent = `${grandTotal.toLocaleString()} DZD`;
        }

        function removeItem(index) {
            currentCart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(currentCart));
            renderCart();
        }

        async function detectLocation() {
            const btn = document.getElementById('locate-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span>⏳ Detecting location...</span>`;

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                btn.disabled = false;
                btn.innerHTML = originalText;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                        const data = await res.json();

                        if (data && data.address) {
                            const addr = data.address;
                            const road = addr.road || addr.pedestrian || addr.neighbourhood || "";
                            const detectedCommune = addr.suburb || addr.town || addr.village || addr.city_district || addr.city || "";
                            
                            // Match commune dropdown if available
                            const communeSelect = document.getElementById('cust-commune');
                            let matched = false;
                            for (let i = 0; i < communeSelect.options.length; i++) {
                                if (communeSelect.options[i].value.toLowerCase().includes(detectedCommune.toLowerCase())) {
                                    communeSelect.selectedIndex = i;
                                    matched = true;
                                    break;
                                }
                            }
                            
                            let addressParts = [road, detectedCommune].filter(Boolean);
                            let fullStreet = addressParts.join(', ');
                            if (fullStreet) {
                                document.getElementById('cust-address').value = `${fullStreet}`;
                            } else {
                                document.getElementById('cust-address').value = `GPS Location (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
                            }
                        } else {
                            document.getElementById('cust-address').value = `GPS Location (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
                        }
                    } catch (e) {
                        console.error("Geocoding failed:", e);
                        document.getElementById('cust-address').value = `GPS Location (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
                    } finally {
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }
                },
                (error) => {
                    alert("Unable to retrieve location. Please check browser permissions or enter address manually.");
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function handleCheckout(e) {
            e.preventDefault();

            if (currentCart.length === 0) {
                alert("Your basket is empty.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = "PROCESSING ORDER & DISPATCHING...";

            const wilayaCode = document.getElementById('cust-wilaya').value;
            const wilayaInfo = WILAYA_RATES[wilayaCode];
            const wilayaName = wilayaInfo ? wilayaInfo.name : wilayaCode;
            const deliveryType = document.getElementById('cust-delivery-type').value;
            const userAddress = document.getElementById('cust-address').value;
            const customerName = document.getElementById('cust-name').value;
            const customerPhone = document.getElementById('cust-phone').value;
            const customerCommune = document.getElementById('cust-commune').value;
            
            const grandTotal = itemsSubtotal + activeDeliveryFee;
            const fullAddressInfo = `${userAddress} (${deliveryType === 'home' ? 'Home' : 'Stop Desk'} | Delivery: ${activeDeliveryFee} DZD | Grand Total: ${grandTotal} DZD)`;
            const productListText = currentCart.map(i => `${i.title} (${i.size || 'Standard'})`).join(', ');

            try {
                // Fetch valid product IDs from database to safely validate existing IDs vs test items
                const { data: dbProducts } = await _supabase.from('products').select('id');
                const validProductIds = new Set((dbProducts || []).map(p => String(p.id)));

                // 1. Insert into Supabase Orders Table
                for (const item of currentCart) {
                    const rawId = item.id ? String(item.id) : null;
                    const validProductId = (rawId && validProductIds.has(rawId)) ? item.id : null;

                    const orderPayload = {
                        customer_name: customerName,
                        phone_number: customerPhone,
                        wilaya: `${wilayaCode} - ${wilayaName}`,
                        commune: customerCommune,
                        address: fullAddressInfo
                    };

                    // Send product_id only if valid to avoid foreign key errors
                    if (validProductId !== null) {
                        orderPayload.product_id = validProductId;
                    }

                    const { error } = await _supabase.from('orders').insert([orderPayload]);
                    if (error) throw error;
                }

                // 2. Dispatch to EcoTrack via Supabase Edge Function
                const ecoTrackResult = await sendToEcoTrack({
                    clientName: customerName,
                    clientPhone: customerPhone,
                    codeWilaya: parseInt(wilayaCode, 10),
                    wilaya: wilayaName,
                    commune: customerCommune,
                    address: userAddress,
                    deliveryType: deliveryType,
                    totalPrice: grandTotal,
                    products: productListText
                });

                if (ecoTrackResult.success) {
                    alert(`Order placed and synced to EcoTrack successfully!`);
                } else {
                    alert(`Order saved to database! (EcoTrack sync note: ${ecoTrackResult.error || 'Check dashboard'})`);
                }

                localStorage.removeItem('cart');
                window.location.href = "index.html";
            } catch (err) {
                alert("Error placing order: " + err.message);
                btn.disabled = false;
                btn.textContent = "Confirm Order";
            }
        }

        async function sendToEcoTrack(orderDetails) {
            try {
                // Targets the deployed function slug: 'swift-processor'
                const { data, error } = await _supabase.functions.invoke('swift-processor', {
                    body: orderDetails
                });

                if (error) {
                    console.error("Supabase Edge Function error:", error);
                    return { success: false, error: error.message };
                }

                if (data && (data.status === 200 || data.status === 201 || data.success || data.tracking || data.id)) {
                    return { success: true, tracking: data.tracking || data.id };
                } else {
                    return { success: false, error: data?.message || JSON.stringify(data) };
                }
            } catch (err) {
                console.error("EcoTrack connection error:", err);
                return { success: false, error: err.message };
            }
        }

        initWilayaSelect();
        renderCart();
    </script>
