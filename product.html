<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENNNSTOREE | Item Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #fafafa; color: #09090b; }
        .y2k-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="min-h-screen p-6 max-w-5xl mx-auto space-y-6">

    <a href="index.html" class="inline-block font-bold text-xs uppercase text-red-600 hover:underline">← Back to Catalog</a>

    <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="text-center py-12 text-zinc-400">Loading product details...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://oshltauwzurnxaqjlwdz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-WBcVndQ2JVR55yt6QfhFg_k1XB5ANd";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function loadProductDetails() {
            if (!productId) return;

            const { data: p, error } = await _supabase.from('products').select('*').eq('id', productId).single();

            if (error || !p) {
                document.getElementById('product-container').innerHTML = `<p class="text-red-500 font-bold">Product not found.</p>`;
                return;
            }

            // Split comma-separated image URLs
            const images = (p.image_url || '').split(',').filter(Boolean);
            const mainImg = images[0] || 'https://via.placeholder.com/400';

            document.getElementById('product-container').innerHTML = `
                <!-- Gallery Section -->
                <div class="space-y-4">
                    <div class="h-96 bg-zinc-100 rounded-3xl overflow-hidden border border-red-200">
                        <img id="main-product-img" src="${mainImg}" class="w-full h-full object-cover">
                    </div>
                    ${images.length > 1 ? `
                        <div class="flex gap-3 overflow-x-auto pb-2">
                            ${images.map((img, idx) => `
                                <img src="${img}" onclick="setMainImage('${img}')" class="w-20 h-20 object-cover rounded-xl border-2 cursor-pointer hover:border-red-600 transition ${idx === 0 ? 'border-red-600' : 'border-zinc-200'}">
                            `).join('')}
                        </div>
                    ` : ''}
                </div>

                <!-- Product Details & Buy Form -->
                <div class="space-y-6 flex flex-col justify-between">
                    <div class="space-y-3">
                        <span class="bg-red-100 text-red-600 text-xs font-black px-2.5 py-1 rounded uppercase">Size: ${p.size}</span>
                        <h1 class="text-3xl font-black text-zinc-950 uppercase">${p.title}</h1>
                        <p class="text-2xl font-black text-red-600">${p.price} DZD</p>
                        <p class="text-xs text-zinc-600 leading-relaxed">${p.description || 'No additional description.'}</p>
                    </div>

                    <button onclick="addToCart(${p.id}, '${p.title.replace(/'/g, "\\'")}', ${p.price}, '${mainImg}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl uppercase text-xs transition">
                        🛒 Add To Basket
                    </button>
                </div>
            `;
        }

        function setMainImage(url) {
            document.getElementById('main-product-img').src = url;
        }

        function addToCart(id, title, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.push({ id, title, price, image });
            localStorage.setItem('cart', JSON.stringify(cart));
            alert("Added to basket!");
            window.location.href = "cart.html";
        }

        loadProductDetails();
    </script>
</body>
</html>
